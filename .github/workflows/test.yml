name: TypeScript
on:
  push:
    types: [typescript]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Install dependencies
        run: npm install
      - name: Build and test
        run: npm run build && npm run test
      - name: Always succeed
        run: echo 'Build and test successful'